
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROTECH Factory Management</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f6f8;
  color: #222;
}

.header {
  background: #1b5e20;
  color: white;
  padding: 22px 18px;
}

.header h1 {
  font-size: 25px;
}

.header p {
  margin-top: 5px;
  opacity: .9;
}

.container {
  padding: 18px;
  max-width: 1000px;
  margin: auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card h3 {
  margin-bottom: 8px;
  font-size: 16px;
}

.number {
  font-size: 26px;
  font-weight: bold;
}

.section {
  margin-top: 22px;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 12px;
}

button {
  border: none;
  padding: 16px;
  border-radius: 12px;
  background: white;
  box-shadow: 0 2px 7px rgba(0,0,0,.08);
  font-size: 15px;
  font-weight: bold;
  text-align: left;
}

button:active {
  transform: scale(.98);
}

.footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 13px;
}

@media(max-width:500px) {
  .grid,
  .menu {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>AGROTECH</h1>
  <p>Factory Management System</p>
</div>

<div class="container">

  <div class="grid">

    <div class="card">
      <h3>📦 Raw Material</h3>
      <div class="number">0 KG</div>
      <p>Current Stock</p>
    </div>

    <div class="card">
      <h3>⚙️ Production</h3>
      <div class="number">0 KG</div>
      <p>Today's Production</p>
    </div>

    <div class="card">
      <h3>📦 Finished Stock</h3>
      <div class="number">0 KG</div>
      <p>Ready Products</p>
    </div>

    <div class="card">
      <h3>🚚 Dispatch</h3>
      <div class="number">0 KG</div>
      <p>Today's Dispatch</p>
    </div>

  </div>

  <div class="section">
    <h2>Factory Management</h2>

    <div class="menu">

      <button>📥 Material Received</button>
      <button>📤 Material Issued</button>

      <button>🏪 Storage</button>
      <button>⚙️ Production</button>

      <button>📦 Packing</button>
      <button>🚚 Dispatch</button>

      <button>📊 Reports</button>
      <button>👥 Users</button>

    </div>
  </div>

</div>

<div class="footer">
  AGROTECH Factory Management System
</div>

</body>
</html>
